# Render Blueprint — https://render.com/docs/blueprint-spec
#
# With this file in the repo root, Render configures the service itself:
# New → Blueprint → pick this repo. It will ask you for GEMINI_API_KEY and
# nothing else.

services:
  - type: web
    name: social-transcriber
    runtime: docker
    plan: free
    # frankfurt is the closest free region to Egypt. Others: oregon, ohio,
    # virginia, singapore. If Instagram/TikTok block you, changing region is
    # one of the cheaper things to try.
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # sync: false means "ask me in the dashboard" — the key never touches git.
      - key: GEMINI_API_KEY
        sync: false

      # Uncomment and set in the dashboard if you hit IP blocks.
      # - key: YTDLP_PROXY
      #   sync: false

      # Free instances have 512 MB RAM; keep clips small enough to survive it.
      - key: MAX_FILESIZE_MB
        value: "80"
      - key: COMPRESS_ABOVE_MB
        value: "30"
      - key: CLIP_TTL_MINUTES
        value: "15"
